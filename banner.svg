<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="APIC - Advanced Image Processing Center" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff9d"/>
      <stop offset="0.5" stop-color="#3ee0ff"/>
      <stop offset="1" stop-color="#ff37c9"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39ff9d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39ff9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff37c9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff37c9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>

  <circle cx="180" cy="70" r="260" fill="url(#glowG)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="320" r="280" fill="url(#glowP)">
    <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- tool chips -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g transform="translate(330,300)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#39ff9d" fill-opacity="0.10" stroke="#39ff9d" stroke-opacity="0.7"/><text y="5" fill="#39ff9d">EDIT</text></g>
    <g transform="translate(455,300)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#3ee0ff" fill-opacity="0.10" stroke="#3ee0ff" stroke-opacity="0.7"/><text y="5" fill="#3ee0ff">CONVERT</text></g>
    <g transform="translate(580,300)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#fff23e" fill-opacity="0.10" stroke="#fff23e" stroke-opacity="0.7"/><text y="5" fill="#fff23e">COMPRESS</text></g>
    <g transform="translate(705,300)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#ff37c9" fill-opacity="0.10" stroke="#ff37c9" stroke-opacity="0.7"/><text y="5" fill="#ff37c9">REMOVE BG</text></g>
    <g transform="translate(830,300)"><rect x="-55" y="-18" width="110" height="36" rx="18" fill="#8dffc4" fill-opacity="0.10" stroke="#8dffc4" stroke-opacity="0.7"/><text y="5" fill="#8dffc4">RESIZE</text></g>
  </g>

  <!-- title -->
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI Black', 'Arial Black', Impact, Helvetica, Arial, sans-serif" font-size="136" font-weight="900" letter-spacing="14" fill="url(#neon)">APIC</text>
  <text x="600" y="224" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="8" fill="#eef1f6" fill-opacity="0.85">ADVANCED IMAGE PROCESSING CENTER</text>
  <text x="600" y="258" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b8fa3">Free. Private. In your browser. Zero uploads.</text>

  <!-- scanning line -->
  <rect x="0" y="0" width="3" height="380" fill="url(#neon)" opacity="0.5">
    <animate attributeName="x" values="0;1197;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="2"/>
</svg>
